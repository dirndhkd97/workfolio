name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: workfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify community permissions and authentication
        run: |
          npm run check:community
          npm run test:community

      - name: Build
        run: npm run build

      - name: Apply additive community schema
        run: |
          npx wrangler d1 execute DB --remote --file migrations/0005_community_auth.sql
          npx wrangler d1 execute DB --remote --file migrations/0006_community_board.sql
          npx wrangler d1 execute DB --remote --file migrations/0007_community_kakao_events.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name workfolio --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
