name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check production configuration and database without writes or deployment
        required: false
        default: false
        type: boolean

concurrency:
  group: workfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ !inputs.preflight_only }}
        run: npm ci

      - name: Check production readiness without writes
        run: node scripts/release-community.mjs --preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ae40d286be880d4faf549a14530875dc

      - name: Verify community permissions and authentication
        if: ${{ !inputs.preflight_only }}
        run: |
          npm run check:community
          npm run test:community

      - name: Build
        if: ${{ !inputs.preflight_only }}
        run: npm run build

      - name: Apply additive schema and reviewed company registry
        if: ${{ !inputs.preflight_only }}
        run: node scripts/release-community.mjs --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ae40d286be880d4faf549a14530875dc

      - name: Deploy to Cloudflare Pages
        if: ${{ !inputs.preflight_only }}
        run: npx wrangler pages deploy dist --project-name workfolio --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Save release audit metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-release-audit
          path: work/release/*.json
          if-no-files-found: ignore
